
<!DOCTYPE html>
<html>
<head>
    <title>Student Register</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 18px;
            width: 350px;
            box-shadow: 0 15px 40px #3334;
        }

        h2 {
            text-align: center;
            color: #252b48;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        ul {
            color: #dc3545;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

</div>

</body>
</html>
