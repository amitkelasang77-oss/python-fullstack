
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h2 {
            color: #252b48;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            background: #fafaff;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(102, 126, 234, 0.35);
        }

        .student-details {
            margin-top: 25px;
            padding: 20px;
            background: #f3f4ff;
            border-radius: 12px;
        }

        .student-details h3 {
            color: #4f46a5;
            margin-bottom: 12px;
        }

        .student-details p {
            color: #444;
            font-size: 14px;
            margin: 9px 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>Student Registration</h2>
            <p>Fill in your details to register</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Registration Number</label>
                <input type="number" name="reg_no"
                       placeholder="Enter registration number" required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" name="marks"
                       placeholder="Enter your marks"
                       min="0" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <button type="submit">Submit Registration →</button>
        </form>

        {% if student %}
        <div class="student-details">
            <h3>Registration Successful!</h3>

            <p><strong>Registration No:</strong> {{ student.reg_no }}</p>
            <p><strong>Name:</strong> {{ student.name }}</p>
            <p><strong>Email:</strong> {{ student.email }}</p>
            <p><strong>Marks:</strong> {{ student.marks }}</p>
            <p><strong>Date of Birth:</strong> {{ student.dob }}</p>
        </div>
        {% endif %}

    </div>

</body>
</html>
